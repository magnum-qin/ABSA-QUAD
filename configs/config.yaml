# DimASQP Configuration File
# SemEval-2026 Task 3: Dimensional Aspect Sentiment Quad Prediction

# Model Configuration
model:
  encoder_name: "microsoft/deberta-v3-base"  # or "bert-base-uncased", "hfl/chinese-macbert-base"
  hidden_size: 768
  num_entity_labels: 7    # RESTAURANT, FOOD, DRINKS, AMBIENCE, SERVICE, LOCATION, NULL
  num_attribute_labels: 6 # GENERAL, PRICES, QUALITY, STYLE_OPTIONS, MISCELLANEOUS, NULL
  dropout: 0.1
  use_crf: false
  
  # V-A Regression
  va_hidden_size: 256
  va_min: 1.0
  va_max: 9.0
  
  # Rethink Module
  rethink:
    enabled: true
    num_iterations: 2
    label_embedding_dim: 64

# Data Configuration  
data:
  train_file: "data/train.jsonl"
  dev_file: "data/dev.jsonl"
  test_file: "data/test.jsonl"
  max_seq_length: 256
  
  # Entity and Attribute Labels (Restaurant Domain)
  entity_labels:
    - "AMBIENCE"
    - "DRINKS"
    - "FOOD"
    - "LOCATION"
    - "RESTAURANT"
    - "SERVICE"
    - "NULL"

  attribute_labels:
    - "GENERAL"
    - "MISCELLANEOUS"
    - "PRICES"
    - "QUALITY"
    - "STYLE_OPTIONS"
    - "NULL"

# Training Configuration
training:
  batch_size: 16
  learning_rate: 2e-5
  encoder_lr: 2e-5
  head_lr: 1e-4
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_epochs: 20
  max_grad_norm: 1.0
  
  # Loss weights
  loss_weights:
    span: 1.0
    pair: 1.0
    entity: 1.0
    attribute: 1.0
    va: 1.0
    consistency: 0.5
  
  # Early stopping
  patience: 5
  
  # Checkpointing
  save_dir: "checkpoints"
  save_top_k: 3

# Evaluation Configuration
evaluation:
  va_tolerance: 0.5  # For continuous F1 calculation
  metrics:
    - "continuous_f1"
    - "exact_f1"
    - "va_rmse"
    - "va_mae"

# Device Configuration
device: "cuda"  # or "cpu"
seed: 42