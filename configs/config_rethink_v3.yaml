# DimASQP Rethink V3: Moderate LR + gentle FGM
# SemEval-2026 Task 3: Dimensional Aspect Sentiment Quad Prediction

# Model Configuration
model:
  encoder_name: "microsoft/deberta-v3-base"
  hidden_size: 768
  num_entity_labels: 7
  num_attribute_labels: 6
  dropout: 0.1
  use_crf: false

  # V-A Regression
  va_hidden_size: 256
  va_min: 1.0
  va_max: 9.0

  # Rethink Module - ENABLED
  rethink:
    enabled: true
    num_iterations: 2
    label_embedding_dim: 64

# Data Configuration
data:
  train_file: "data/subtask_3/eng/eng_restaurant_train_alltasks.jsonl"
  dev_file: "data/subtask_3/eng/eng_restaurant_dev_task3.jsonl"
  test_file: "data/subtask_3/eng/eng_restaurant_test_task3.jsonl"
  max_seq_length: 256

  entity_labels:
    - "RESTAURANT"
    - "FOOD"
    - "DRINKS"
    - "AMBIENCE"
    - "SERVICE"
    - "LOCATION"
    - "NULL"

  attribute_labels:
    - "GENERAL"
    - "PRICES"
    - "QUALITY"
    - "STYLE_OPTIONS"
    - "MISCELLANEOUS"
    - "NULL"

# Training Configuration
training:
  batch_size: 8
  learning_rate: 1.5e-5
  encoder_lr: 1.5e-5
  head_lr: 7.5e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_epochs: 30
  max_grad_norm: 1.0

  # FGM adversarial training - gentle perturbation
  fgm:
    enabled: true
    epsilon: 0.1

  # EMA (Exponential Moving Average)
  ema:
    enabled: true
    decay: 0.999

  # Loss weights
  loss_weights:
    span: 1.0
    pair: 1.0
    entity: 1.0
    attribute: 1.0
    va: 1.0
    consistency: 0.5

  # Early stopping
  patience: 8

  # Checkpointing
  save_dir: "checkpoints/rethink_v3"
  save_top_k: 3

# Evaluation Configuration
evaluation:
  va_tolerance: 0.5
  metrics:
    - "continuous_f1"
    - "exact_f1"
    - "va_rmse"
    - "va_mae"

# Device Configuration
device: "cuda"
seed: 42
