# DimASQP Rethink V4-Large: NULL Anchor + CRF + DeBERTa-v3-large
# Changes vs V4 base:
#   - encoder: deberta-v3-large (hidden=1024, 24 layers vs 12)
#   - batch_size: 4 (larger model, less VRAM)
#   - gradient_accumulation_steps: 2 (effective batch=8, same as base)
#   - encoder_lr: 1.0e-5 (slightly lower for larger model stability)

model:
  encoder_name: "microsoft/deberta-v3-large"
  hidden_size: 1024
  num_entity_labels: 7
  num_attribute_labels: 6
  dropout: 0.1
  use_crf: true
  category_embed_dim: 0

  va_hidden_size: 256
  va_min: 1.0
  va_max: 9.0

  rethink:
    enabled: true
    num_iterations: 2
    label_embedding_dim: 64

data:
  train_file: "data/subtask_3/eng/eng_restaurant_train_alltasks.jsonl"
  dev_file: "data/subtask_3/eng/eng_restaurant_dev_task3.jsonl"
  test_file: "data/subtask_3/eng/eng_restaurant_test_task3.jsonl"
  max_seq_length: 256

  entity_labels:
    - "AMBIENCE"
    - "DRINKS"
    - "FOOD"
    - "LOCATION"
    - "RESTAURANT"
    - "SERVICE"
    - "NULL"

  attribute_labels:
    - "GENERAL"
    - "MISCELLANEOUS"
    - "PRICES"
    - "QUALITY"
    - "STYLE_OPTIONS"
    - "NULL"

training:
  batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 1.0e-5
  encoder_lr: 1.0e-5
  head_lr: 5.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  num_epochs: 30
  max_grad_norm: 1.0

  fgm:
    enabled: true
    epsilon: 0.1

  ema:
    enabled: true
    decay: 0.999

  loss_weights:
    span: 2.0
    pair: 1.0
    entity: 1.0
    attribute: 1.0
    va: 1.5
    consistency: 0.5

  patience: 8

  save_dir: "checkpoints/rethink_v4_large"
  save_top_k: 5

evaluation:
  va_tolerance: 0.5
  metrics:
    - "continuous_f1"
    - "exact_f1"
    - "va_rmse"
    - "va_mae"

device: "cuda"
seed: 42
