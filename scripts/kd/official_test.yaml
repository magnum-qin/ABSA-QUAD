# One-shot post-competition evaluation protocol for the released SemEval-2026
# Task 3 test labels. This matrix was locked before inspecting any gold labels.

protocol:
  locked_at: "2026-07-18T21:50:41+09:00"
  selection_basis: dev_only
  no_test_tuning: true
  official_repository: https://github.com/DimABSA/DimABSA2026.git
  official_commit: bdc93be1224106ae7d3eb95739c02a76ed4ae8a1
  official_subtree: task-dataset/track_a/subtask_3
  gold_root: data/official_test_gold/DimABSA2026/bdc93be1224106ae7d3eb95739c02a76ed4ae8a1
