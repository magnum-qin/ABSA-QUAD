# KD experiment registry — declarative ledger of every V23 knowledge-distillation run.
# Consumed by scripts/kd/pipeline.py:  python scripts/kd/pipeline.py --exp <name>
# Naming follows docs/NAMING.md:  v23_<dataset>_<teacher>[_<variant>]
#
# Fields:
#   dataset/lang/domain : dataset identity (domain feeds the silver prompt)
#   teacher             : deepseek | qwen | gemma  (selects labeler + endpoint)
#   pool                : {source: gen|real|trans|existing, n, file}
#   gold_base           : training data WITHOUT silver; distill = gold_base + silver
#   distill_prebuilt    : true if gold_base ALREADY contains silver (skip build step)
#   silver_cap          : keep only N silver rows (0 = all) -> controls silver:gold ratio
#   base_config         : pipeline yaml to derive encoder/hparams from
#   result / status     : recorded outcome (documentation)

defaults:
  seeds: [42, 123, 456, 789, 1024]
  vote_sweep: [2, 3, 4]
  topk_sweep: [0.0, 0.10]
  # local teacher served by Unsloth Studio (OpenAI-compatible /v1; api key via $UNSLOTH_API_KEY env)
  local_base_url: http://localhost:8888/v1
  qwen_model: "unsloth/Qwen3.6-35B-A3B-MTP-GGUF"
  gemma_model: "unsloth/gemma-4-31B-it-qat-GGUF"
  deepseek_model: "deepseek-v4-pro"

